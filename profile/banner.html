<!doctype html>
<!-- Org profile header. Screenshots come from each frontend repo docs/screenshot.png (copy to assets/planriean.png, gs.png, twc.png), render 1280x640 @2x with readme-header scripts/render-banner.ts -> assets/banner.png -->
<html lang="th">
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@500;700&display=block" rel="stylesheet" />
<style>
  /* colors from the org avatar: night-sky purple, sand planet, coral smile, teal star */
  :root { --bg: #17141f; --ink: #efe9dc; --muted: #a9a2b6; --accent: #e3c58e; --coral: #f08a6c; --glow: rgb(227 197 142 / 0.22); --teal: rgb(64 160 150 / 0.20); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; background: var(--bg); }
  body {
    font-family: "IBM Plex Sans Thai", "Noto Sans Thai", "Inter", sans-serif; color: var(--ink); position: relative;
    background:
      radial-gradient(760px 380px at 50% 104%, var(--glow), transparent 70%),
      radial-gradient(520px 300px at 96% -6%, var(--teal), transparent 70%),
      radial-gradient(520px 300px at 2% 100%, rgb(150 90 170 / 0.16), transparent 70%),
      linear-gradient(rgb(255 255 255 / 0.03) 1px, transparent 1px) 0 0 / 40px 40px,
      linear-gradient(90deg, rgb(255 255 255 / 0.03) 1px, transparent 1px) 0 0 / 40px 40px,
      var(--bg);
  }
  /* pixel stars like the avatar */
  .star { position: absolute; width: 8px; height: 8px; background: var(--c); opacity: .75; }
  .plus { position: absolute; width: 24px; height: 24px; opacity: .7;
    background: linear-gradient(var(--c),var(--c)) center/8px 24px no-repeat, linear-gradient(var(--c),var(--c)) center/24px 8px no-repeat; }
  .top { text-align: center; padding-top: 44px; position: relative; }
  .brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 700; font-size: 26px; }
  .brand img { width: 44px; height: 44px; border-radius: 11px; image-rendering: pixelated; }
  h1 { margin-top: 18px; font-size: 50px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; }
  h1 em { font-style: normal; color: var(--accent); }
  .checks { margin-top: 14px; display: flex; justify-content: center; gap: 22px; font-size: 19px; font-weight: 500; color: var(--muted); }
  .checks span::before { content: "✔"; color: var(--coral); margin-right: 7px; }
  .shot {
    position: absolute; top: var(--t); left: var(--l); width: 560px; height: 420px; overflow: hidden;
    border-radius: 14px; border: 1px solid rgb(255 255 255 / 0.14);
    box-shadow: 0 -10px 50px rgb(0 0 0 / .45), 0 0 0 6px rgb(255 255 255 / 0.03);
    transform: rotate(var(--r)); background: #0d0c12;
  }
  .shot img { width: 100%; height: 100%; object-fit: cover; object-position: top left; display: block; }
  .mid { z-index: 2; width: 700px; height: 300px; }
  .mid img { height: auto; }
</style>
</head>
<body>
  <i class="star" style="left:96px;top:120px;--c:#7a5a86"></i>
  <i class="star" style="left:212px;top:64px;--c:#4d6a86"></i>
  <i class="star" style="left:1140px;top:170px;--c:#8a6a78"></i>
  <i class="star" style="left:1010px;top:52px;--c:#4d6a86"></i>
  <i class="plus" style="left:150px;top:220px;--c:#6b4f7d"></i>
  <i class="plus" style="left:1180px;top:84px;--c:#3f8a86"></i>

  <div class="top">
    <div class="brand"><img src="assets/avatar.png" alt="" />PlutoStudio</div>
    <h1>ทีมเล็กที่ทำ <em>ระบบให้ใช้งานจริง</em> ตั้งแต่ต้นจนจบ</h1>
    <div class="checks">
      <span>เว็บแอป &amp; ระบบหลังบ้าน</span>
      <span>API &amp; ระบบเชื่อมต่อ</span>
      <span>Data &amp; AI</span>
      <span>ดูแลหลังขึ้นระบบ</span>
    </div>
  </div>
  <div class="shot" style="--l:40px;--t:360px;--r:-5deg"><img src="assets/gs.png" alt="" /></div>
  <div class="shot" style="--l:680px;--t:360px;--r:5deg"><img src="assets/twc.png" alt="" /></div>
  <div class="shot mid" style="--l:290px;--t:352px;--r:0deg"><img src="assets/planriean.png" alt="" /></div>
</body>
</html>
